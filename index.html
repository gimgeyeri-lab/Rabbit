<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mavi Qəhrəman – Platformer</title>
<style>
:root{--bg:#eef3f8;--fg:#1b2733;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e6edf3;--card:#1a232d}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e6edf3;--card:#1a232d}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
h1{font-size:18px;margin:4px 0 0}
canvas{width:100%;max-width:640px;border-radius:12px;background:#9fd8ff;touch-action:none;image-rendering:pixelated}
.hint{font-size:13px;opacity:.75;text-align:center}
.pad{display:flex;gap:10px;width:100%;max-width:640px;justify-content:space-between}
.pad div{flex:1;background:var(--card);border-radius:12px;padding:16px 0;text-align:center;font-size:20px;user-select:none;-webkit-user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pad div.on{filter:brightness(.8)}
</style>
</head>
<body>
<h1>🐰 Dovşan Qəhrəman</h1>
<canvas id="c" width="640" height="448"></canvas>
<div class="pad"><div id="bl">◀</div><div id="br">▶</div><div id="bj">⤒ Hoppan</div></div>
<div class="hint">← → / A D hərəkət · Boşluq / ↑ hoppanma · Düşmənin üstünə tullan · ⚡ yığ: havada ikinci hoppanma · ❤ yığ: əlavə can · 🥕 yığ, Boss-u əz (dalğalardan tullan), bayraqa çat</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const T=32,H=14,W=150,VW=640;
let map,coins,enemies,player,cam,lives,score,state,powers;
let level=1,boss=null,ck=0,waves=[],parts=[],shk=0,hearts=[],hdone={};const CK=[0,64,68,68];
function puff(x,y,n,c='#fff'){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,l:30,c})}
function stepFx(){parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.l--});parts=parts.filter(q=>q.l>0);if(shk>0)shk=Math.max(0,shk-.6)}
let best=0;try{best=+localStorage.getItem('mq_best')||0}catch(e){}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('mq_best',best)}catch(e){}}}
function beep(f,d=.08){try{const a=beep.a||(beep.a=new AudioContext());const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
const keys={};
function build(){
  map=Array.from({length:H},()=>Array(W).fill(0));
  const gaps=level===1?[[18,19],[34,35],[52,53],[70,71],[90,91],[110,111]]:level===3?[[12,15],[22,25],[34,37],[46,49],[60,63],[74,77],[88,91]]:[[14,17],[26,29],[40,43],[56,59],[72,75],[88,91]];
  for(let x=0;x<W;x++){
    if(gaps.some(g=>x>=g[0]&&x<=g[1]))continue;
    map[12][x]=1;map[13][x]=1;
  }
  const plats=level===3?[[8,9,3],[13,7,3],[19,9,3],[23,7,3],[28,9,4],[35,8,3],[40,7,3],[47,9,3],[52,7,4],[61,9,3],[66,7,3],[75,9,3],[80,7,3],[89,9,3],[94,7,3]]:level===2?[[6,9,3],[12,8,3],[20,9,3],[24,7,3],[31,9,3],[36,7,3],[46,9,3],[50,7,4],[62,9,3],[66,7,3],[78,9,3],[82,7,3],[94,9,3]]:[[8,9,4],[14,8,3],[24,9,4],[28,7,3],[40,9,5],[46,7,3],[58,9,4],[63,7,4],[76,9,3],[80,7,4],[96,9,4],[101,7,3],[116,9,5]];
  plats.forEach(([x,y,l])=>{for(let i=0;i<l;i++)map[y][x+i]=2});
  if(level===1)for(let y=9;y<12;y++){map[y][122]=1;map[y][123]=1}
  coins=[];
  plats.forEach(([x,y,l])=>{for(let i=0;i<l;i++)coins.push({x:(x+i)*T+16,y:(y-1)*T+16,got:false})});
  [26,44,66,85,105].forEach(x=>{for(let i=0;i<3;i++)coins.push({x:(x+i)*T+16,y:10*T+16,got:false})});
  enemies=(level===1?[23,42,60,78,98,118]:level===3?[10,29,42,53,67,80,97]:[10,22,33,47,53,65,80,96]).map(x=>({x:x*T,y:11*T+8,w:26,h:24,vx:level===1?-.5:-.8,alive:true,t:'w'}));
  boss=null;
  if(level>=2){
    (level===3?[18,30,54,68,82]:[19,36,62,84]).forEach(x=>enemies.push({x:x*T,y:360,w:26,h:24,vx:-1.1,alive:true,t:'j',vy:0}));
    [[28,5],[44,6],[70,5],[92,6]].forEach(([x,y])=>enemies.push({x:x*T,y:y*T,w:26,h:22,vx:-1,alive:true,t:'f',by:y*T,bx:x*T}));
    boss={x:130*T,y:320,w:64,h:64,vx:-1.6,vy:0,hp:level===3?7:5,mx:level===3?7:5,alive:true,inv:0};
  }
  powers=[29,64,102,119].map(x=>({x:x*T+16,y:6*T+16,got:false}));
  if(ck)coins.forEach(c=>{if(c.x<ck)c.got=true});
  hearts=(level===1?[[15,7],[59,8],[97,8]]:level===3?[[41,6],[67,6],[95,6]]:[[25,6],[67,6],[95,8]]).map(([x,y],i)=>({x:x*T+16,y:y*T+16,got:!!hdone[level+'_'+i],k:level+'_'+i}));
  player={x:ck||64,y:300,w:24,h:30,vx:0,vy:0,on:false,face:1,dj:false,used:false,pj:false};
  cam=0;
}
function solid(tx,ty){if(tx<0||tx>=W)return true;if(ty<0)return false;if(ty>=H)return false;return map[ty][tx]>0}
function hitsSolid(o){
  for(let ty=Math.floor(o.y/T);ty<=Math.floor((o.y+o.h-.01)/T);ty++)
    for(let tx=Math.floor(o.x/T);tx<=Math.floor((o.x+o.w-.01)/T);tx++)
      if(solid(tx,ty))return true;
  return false;
}
function reset(full){
  if(full){lives=5;score=0;level=1;ck=0;hdone={}}
  build();state='play';
}
function die(){beep(120,.3);saveBest();
  lives--;
  if(lives<=0){state='over'}else{const s=score;build();score=s}
}
function update(){
  if(state!=='play')return;
  const p=player,L=keys.ArrowLeft||keys.a||keys.bl,R=keys.ArrowRight||keys.d||keys.br,J=keys.ArrowUp||keys.w||keys[' ']||keys.bj;
  const acc=.6,max=4.2;
  if(L){p.vx-=acc;p.face=-1}
  if(R){p.vx+=acc;p.face=1}
  if(!L&&!R)p.vx*=.8;
  p.vx=Math.max(-max,Math.min(max,p.vx));
  if(p.on)p.coy=7;else if(p.coy>0)p.coy--;
  if(J&&!p.pj)p.buf=6;
  if(p.buf>0){p.buf--;if(p.coy>0){p.vy=-11.5;p.on=false;p.coy=0;p.buf=0;beep(500);puff(p.x+12,p.y+p.h,4)}else if(J&&!p.pj&&p.dj&&!p.used){p.vy=-10.5;p.used=true;p.buf=0;beep(750);puff(p.x+12,p.y+p.h,5)}}
  p.pj=J;if(p.on)p.used=false;
  if(!J&&p.vy<-4)p.vy=-4;
  p.vy=Math.min(p.vy+.55,12);
  p.x+=p.vx;
  if(hitsSolid(p)){p.x-=p.vx;p.vx=0}
  p.y+=p.vy;p.on=false;
  if(hitsSolid(p)){
    if(p.vy>0){p.y=Math.floor((p.y+p.h)/T)*T-p.h;p.on=true}
    else p.y=Math.floor(p.y/T+1)*T;
    p.vy=0;
  }
  if(p.y>H*T+60)return die();
  if(p.x>CK[level]*T&&ck<CK[level]*T){ck=CK[level]*T;beep(800,.15);puff(CK[level]*T+10,9*T,10,'#4caf50')}
  coins.forEach(c=>{if(!c.got&&Math.abs(c.x-(p.x+12))<20&&Math.abs(c.y-(p.y+15))<24){c.got=true;score+=10;beep(900,.05);puff(c.x,c.y,6,'#ff8a1f')}});
  hearts.forEach(h=>{if(!h.got&&Math.abs(h.x-(p.x+12))<22&&Math.abs(h.y-(p.y+15))<26){h.got=true;hdone[h.k]=true;lives=Math.min(lives+1,9);score+=25;beep(1300,.25);puff(h.x,h.y,10,'#ff4d6d')}});
  powers.forEach(w=>{if(!w.got&&Math.abs(w.x-(p.x+12))<22&&Math.abs(w.y-(p.y+15))<26){w.got=true;p.dj=true;score+=25;beep(1100,.2)}});
  for(const e of enemies){
    if(!e.alive)continue;
    e.x+=e.vx;
    if(e.t==='f')e.y=e.by+Math.sin(e.x/40)*40;
    else if(e.t==='j'){e.vy+=.5;e.y+=e.vy;if(e.y>=360){e.y=360;e.vy=0;if(Math.random()<.02)e.vy=-9}}
    const ahead=e.vx<0?e.x-2:e.x+e.w+2;
    const wall=solid(Math.floor(ahead/T),Math.floor((e.y+e.h/2)/T));
    const floor=solid(Math.floor(ahead/T),12);
    if(e.t==='f'){if(Math.abs(e.x-e.bx)>110)e.vx=-Math.sign(e.x-e.bx)*Math.abs(e.vx)}else if(wall||!floor)e.vx*=-1;
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(p.vy>0&&p.y+p.h-e.y<16){e.alive=false;p.vy=-8;score+=50;beep(300,.12);puff(e.x+13,e.y+e.h,8,'#ddd');shk=3}
      else return die();
    }
  }
  if(boss&&boss.alive){
    const b=boss;b.x+=b.vx;if(b.x<106*T)b.vx=Math.abs(b.vx);if(b.x>138*T)b.vx=-Math.abs(b.vx);
    b.vy+=.5;b.y+=b.vy;if(b.y>=320){if(b.vy>2){waves.push({x:b.x,v:-3.5},{x:b.x+b.w,v:3.5});shk=10;beep(100,.2)}b.y=320;b.vy=0;if(Math.random()<.015)b.vy=-10}
    waves.forEach(w=>w.x+=w.v);waves=waves.filter(w=>w.x>0&&w.x<W*T);
    if(waves.some(w=>p.x<w.x+20&&p.x+p.w>w.x&&p.y+p.h>12*T-16))return die();
    if(b.inv>0)b.inv--;
    if(p.x<b.x+b.w&&p.x+p.w>b.x&&p.y<b.y+b.h&&p.y+p.h>b.y&&b.inv===0){
      if(p.vy>0&&p.y+p.h-b.y<28){b.hp--;b.inv=60;p.vy=-12;score+=100;beep(200,.2);shk=14;puff(b.x+32,b.y,14,'#e74c3c');b.vx*=1.15;if(b.hp<=0){b.alive=false;waves=[];score+=500;shk=16;puff(b.x+32,b.y+32,30,'#f1c40f');beep(1200,.5)}}
      else return die();
    }
    if(p.x>(W-6)*T)p.x=(W-6)*T;
  }
  if(p.x>(W-5)*T){saveBest();beep(1000,.4);if(level<3){level++;ck=0;build()}else{state='win';score+=100*lives;saveBest()}}
  cam=Math.max(0,Math.min(W*T-VW,p.x-VW/2));
}
function draw(){
  ctx.clearRect(0,0,640,448);
  const g=ctx.createLinearGradient(0,0,0,448);g.addColorStop(0,level===3?'#0b132b':level===2?'#4a3f7a':'#7cc7ff');g.addColorStop(1,level===3?'#3a506b':level===2?'#f0b49a':'#d6f0ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,640,448);
  ctx.fillStyle='rgba(255,255,255,.8)';
  for(let i=0;i<10;i++){const x=((i*260-cam*.3)%2600+2600)%2600-120;ctx.beginPath();ctx.ellipse(x,70+(i%3)*40,50,18,0,0,7);ctx.fill()}
  ctx.save();ctx.translate(-Math.round(cam)+(shk>0?(Math.random()-.5)*shk:0),shk>0?(Math.random()-.5)*shk:0);
  const s=Math.floor(cam/T),e=s+22;
  for(let y=0;y<H;y++)for(let x=s;x<=e&&x<W;x++){
    const t=map[y][x];if(!t)continue;
    if(t===1){ctx.fillStyle=y>=13||map[y-1]?.[x]===1?'#8a5a2b':'#8a5a2b';ctx.fillRect(x*T,y*T,T,T);
      if(!map[y-1]||map[y-1][x]!==1){ctx.fillStyle='#4caf50';ctx.fillRect(x*T,y*T,T,8)}}
    else{ctx.fillStyle='#d98c3f';ctx.fillRect(x*T,y*T,T,T);ctx.strokeStyle='#8c5420';ctx.lineWidth=2;ctx.strokeRect(x*T+1,y*T+1,T-2,T-2)}
  }
  coins.forEach(c=>{if(c.got)return;ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.moveTo(c.x-6,c.y-8);ctx.lineTo(c.x+6,c.y-8);ctx.lineTo(c.x,c.y+10);ctx.fill();ctx.fillStyle='#3fb34f';ctx.fillRect(c.x-4,c.y-13,3,6);ctx.fillRect(c.x+1,c.y-13,3,6)});
  hearts.forEach(h=>{if(h.got)return;ctx.font='24px system-ui';ctx.fillStyle='#ff4d6d';ctx.fillText('❤',h.x-11,h.y+8+Math.sin(Date.now()/250+h.x)*3)});
  powers.forEach(w=>{if(w.got)return;ctx.font='24px system-ui';ctx.fillText('⚡',w.x-12,w.y+8+Math.sin(Date.now()/200)*3)});
  enemies.forEach(en=>{if(!en.alive)return;ctx.fillStyle=en.t==='j'?'#e67e22':en.t==='f'?'#16a085':'#8e44ad';ctx.fillRect(en.x,en.y+6,en.w,en.h-6);
    ctx.beginPath();ctx.moveTo(en.x,en.y+8);for(let i=0;i<4;i++){ctx.lineTo(en.x+i*7+3.5,en.y);ctx.lineTo(en.x+i*7+7,en.y+8)}ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(en.x+5,en.y+10,5,5);ctx.fillRect(en.x+16,en.y+10,5,5)});
  waves.forEach(w=>{ctx.fillStyle='#f39c12';ctx.beginPath();ctx.moveTo(w.x,12*T);ctx.lineTo(w.x+10,12*T-18);ctx.lineTo(w.x+20,12*T);ctx.fill()});
  if(boss&&boss.alive){const b=boss;ctx.globalAlpha=b.inv>0&&Math.floor(b.inv/5)%2?.4:1;ctx.fillStyle='#7d3c98';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,14);ctx.fill();ctx.fillStyle='#e74c3c';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(b.x+i*16,b.y+4);ctx.lineTo(b.x+i*16+8,b.y-14);ctx.lineTo(b.x+i*16+16,b.y+4);ctx.fill()}ctx.fillStyle='#fff';ctx.fillRect(b.x+12,b.y+16,14,14);ctx.fillRect(b.x+38,b.y+16,14,14);ctx.fillStyle='#c0392b';ctx.fillRect(b.x+14,b.y+20,8,8);ctx.fillRect(b.x+40,b.y+20,8,8);ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(b.x,b.y-26,b.w,6);ctx.fillStyle='#e74c3c';ctx.fillRect(b.x,b.y-26,b.w*b.hp/b.mx,6)}
  const kx=CK[level]*T;ctx.fillStyle='#555';ctx.fillRect(kx,9*T,3,3*T);ctx.fillStyle=ck>=kx?'#4caf50':'#bbb';ctx.beginPath();ctx.moveTo(kx+3,9*T);ctx.lineTo(kx+26,9*T+10);ctx.lineTo(kx+3,9*T+20);ctx.fill();
  // flag
  const fx=(W-5)*T+8;ctx.fillStyle='#555';ctx.fillRect(fx,6*T,4,6*T);ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.moveTo(fx+4,6*T);ctx.lineTo(fx+40,6*T+14);ctx.lineTo(fx+4,6*T+28);ctx.fill();
  // player
  const p=player;
  ctx.fillStyle='#c9a27a';ctx.beginPath();ctx.roundRect(p.x,p.y+4,p.w,p.h-4,9);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.face>0?p.x-1:p.x+p.w+1,p.y+22,5,0,7);ctx.fill();
  ctx.fillStyle='#c9a27a';ctx.beginPath();ctx.roundRect(p.x+4,p.y-14,7,20,4);ctx.roundRect(p.x+14,p.y-14,7,20,4);ctx.fill();ctx.fillStyle='#f4a6b8';ctx.fillRect(p.x+6,p.y-10,3,12);ctx.fillRect(p.x+16,p.y-10,3,12);ctx.fillRect(p.x+10+p.face*9,p.y+15,4,3);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+12+p.face*4,p.y+11,5,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(p.x+12+p.face*6,p.y+11,2.4,0,7);ctx.fill();
  
  parts.forEach(q=>{ctx.globalAlpha=Math.max(0,q.l/30);ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4)});ctx.globalAlpha=1;ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(8,8,370,30);
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';
  ctx.fillText('❤ '+lives+'  🥕 '+score+'  S'+level+'  🏆 '+best+(player.dj?'  ⚡':''),18,29);
  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,640,448);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 36px system-ui';
    ctx.fillText(state==='win'?'🏁 Qalib gəldin!':'💀 Oyun bitdi',320,200);
    ctx.font='18px system-ui';ctx.fillText('Xal: '+score+' · Yenidən başlamaq üçün toxun / Enter',320,240);ctx.textAlign='left';
  }
}
function credit(){ctx.font='bold 13px system-ui';ctx.textAlign='right';ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillText('Hazırladı: Ramil',633,439);ctx.fillStyle='#fff';ctx.fillText('Hazırladı: Ramil',632,438);ctx.textAlign='left'}
function loop(){update();draw();credit();stepFx();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='Enter'&&state!=='play')reset(true)});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
[['bl'],['br'],['bj']].forEach(([id])=>{const b=document.getElementById(id);
  const on=ev=>{ev.preventDefault();keys[id]=true;b.classList.add('on')},off=ev=>{ev.preventDefault();keys[id]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
cv.addEventListener('pointerdown',()=>{if(state!=='play')reset(true)});
reset(true);loop();
</script>
</body>
</html>
